services:
  app:
    build: .
    container_name: mini-crm-app
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - mini-crm-network

  web:
    image: nginx:alpine
    container_name: mini-crm-web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mini-crm-network

  db:
    image: mysql:8
    container_name: mini-crm-db
    restart: always
    environment:
      MYSQL_DATABASE: mini_crm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - mini-crm-network

networks:
  mini-crm-network:
    driver: bridge
